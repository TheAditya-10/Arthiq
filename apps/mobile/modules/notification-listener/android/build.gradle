apply plugin: 'com.android.library'

group = 'dev.arthiq.notificationlistener'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()
useExpoPublishing()

android {
  namespace "dev.arthiq.notificationlistener"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Only stock platform APIs (NotificationListenerService) plus React Native
  // itself for HeadlessJsTaskService — never a third-party payment SDK. See
  // docs/ADR/005-notification-ingestion.md.
  implementation 'com.facebook.react:react-android'
}
